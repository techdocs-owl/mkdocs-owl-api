site_name: MkDocs Owl
site_description: >-
  Techdocs Owl plugin form MkDocs that renders AsyncAPI and OpenAPI specs into reference
  pages at build time.
site_url: https://techdocs-owl.github.io/mkdocs-owl-api/

repo_url: https://github.com/techdocs-owl/mkdocs-owl-api
repo_name: techdocs-owl/mkdocs-owl-api

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Customization: customization.md
  - Examples:
      - Streetlight (AsyncAPI): examples/streetlight.md
      - Petstore (OpenAPI): examples/petstore.md

theme:
  name: material
  logo: assets/icon-white.svg
  favicon: assets/icon.svg
  font:
    text: Ubuntu
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - owl-api
