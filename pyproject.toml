[project]
name = "mkdocs-owl-api"
version = "0.1.0"
description = "MkDocs plugin from TechDocs Owl, renders AsyncAPI and OpenAPI specs into reference pages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "mkdocs>=1.5",
    "PyYAML>=6.0",
    "Markdown>=3.4",
]

[project.entry-points."mkdocs.plugins"]
owl-api = "mkdocs_owl_api.plugin:OwlApiPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_owl_api"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mkdocs-material>=9.5",
]
