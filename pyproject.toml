[project]
name = "mkdocs-owl-api"
version = "0.2.0"
description = "MkDocs plugin from TechDocs Owl, renders AsyncAPI and OpenAPI specs into reference pages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Dima Patserkovskyi", email = "dmtwngtech@pm.me" },
]
keywords = [
    "mkdocs",
    "mkdocs-plugin",
    "openapi",
    "asyncapi",
    "documentation",
    "api-reference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "mkdocs>=1.6",
    "PyYAML>=6.0",
    "Markdown>=3.4",
]

[project.urls]
Homepage = "https://github.com/techdocs-owl/mkdocs-owl-api"
Repository = "https://github.com/techdocs-owl/mkdocs-owl-api"
Issues = "https://github.com/techdocs-owl/mkdocs-owl-api/issues"

[project.entry-points."mkdocs.plugins"]
owl-api = "mkdocs_owl_api.plugin:OwlApiPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_owl_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mkdocs-material>=9.5",
]
